spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

places-plates:
  google-maps:
    api-key: ${GOOGLE_MAPS_API_KEY}
  security:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:3000,http://localhost:3100}
  bootstrap-admin:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  storage:
    api-url: ${SUPABASE_STORAGE_API_URL:}
    service-role-key: ${SUPABASE_STORAGE_SERVICE_ROLE_KEY:}
    temporary-bucket: ${SUPABASE_TEMPORARY_UPLOAD_BUCKET:temporary-uploads}
    sanitized-bucket: ${SUPABASE_SANITIZED_PHOTO_BUCKET:temporary-uploads}
  image:
    max-pixels: ${IMAGE_MAX_PIXELS:25000000}
    jpeg-quality: ${IMAGE_MASTER_JPEG_QUALITY:0.92}
    variant-jpeg-quality: ${IMAGE_VARIANT_JPEG_QUALITY:0.88}
  cleanup:
    enabled: ${TEMPORARY_ORIGINAL_CLEANUP_ENABLED:true}
    initial-delay: ${TEMPORARY_ORIGINAL_CLEANUP_INITIAL_DELAY:PT30S}
    interval: ${TEMPORARY_ORIGINAL_CLEANUP_INTERVAL:PT15M}
    batch-size: ${TEMPORARY_ORIGINAL_CLEANUP_BATCH_SIZE:25}
