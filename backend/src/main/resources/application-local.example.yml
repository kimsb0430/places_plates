spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

places-plates:
  google-maps:
    api-key: ${GOOGLE_MAPS_API_KEY}
  security:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:3000,http://localhost:3100}
  bootstrap-admin:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
