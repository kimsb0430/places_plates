spring:
  application:
    name: places-plates-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:5}
      minimum-idle: ${DATABASE_MIN_IDLE:0}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT:30000}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations:
      - classpath:db/migration/common
      - classpath:db/migration/{vendor}
  session:
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

places-plates:
  security:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:3000,http://localhost:3100}
    database-row-security-enabled: true
  bootstrap-admin:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  storage:
    api-url: ${SUPABASE_STORAGE_API_URL:}
    service-role-key: ${SUPABASE_STORAGE_SERVICE_ROLE_KEY:}
    temporary-bucket: ${SUPABASE_TEMPORARY_UPLOAD_BUCKET:temporary-uploads}
    sanitized-bucket: ${SUPABASE_SANITIZED_PHOTO_BUCKET:temporary-uploads}
  image:
    max-pixels: ${IMAGE_MAX_PIXELS:25000000}
    jpeg-quality: ${IMAGE_MASTER_JPEG_QUALITY:0.92}
    variant-jpeg-quality: ${IMAGE_VARIANT_JPEG_QUALITY:0.88}
    watermark:
      version: ${IMAGE_WATERMARK_VERSION:places-plates-corner-v1}
      opacity: ${IMAGE_WATERMARK_OPACITY:0.28}
      target-width-ratio: ${IMAGE_WATERMARK_TARGET_WIDTH_RATIO:0.16}
      margin-ratio: ${IMAGE_WATERMARK_MARGIN_RATIO:0.03}
