spring:
  datasource:
    url: jdbc:h2:mem:placesplates;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/common

places-plates:
  security:
    database-row-security-enabled: false
