name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Build Vercel Next.js artifact
        run: pnpm build:vercel
      - name: Scan Vercel artifact
        shell: pwsh
        run: ..\scripts\check-public-artifact.ps1 -Path .\.next
      - name: Build Sites Vinext artifact
        run: pnpm build
      - name: Scan Sites artifact
        shell: pwsh
        run: ..\scripts\check-public-artifact.ps1 -Path .\dist

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: placesplates_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_admin_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d placesplates_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Prepare non-superuser database owner
        env:
          PGPASSWORD: local_ci_admin_password
        run: >-
          psql -h localhost -U postgres -d placesplates_test -v ON_ERROR_STOP=1
          -c "CREATE ROLE placesplates_test LOGIN PASSWORD 'local_ci_password'"
          -c "ALTER DATABASE placesplates_test OWNER TO placesplates_test"
          -c "ALTER SCHEMA public OWNER TO placesplates_test"
      - name: Test and build
        run: ./gradlew test bootJar --no-daemon
        env:
          POSTGRES_RLS_TEST_ENABLED: "true"
          POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/placesplates_test
          POSTGRES_TEST_USERNAME: placesplates_test
          POSTGRES_TEST_PASSWORD: local_ci_password
