name: Secret protection

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-protection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret protection
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Scan blocked files and secret patterns
        shell: pwsh
        run: .\scripts\check-secrets.ps1
